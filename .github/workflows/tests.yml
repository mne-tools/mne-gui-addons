name: Tests

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}-${{ github.event.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: ['**']
  create:
    branches: [main]
    tags: ['**']

jobs:
  pytest:
    timeout-minutes: 20
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12"]
        mne-version: [mne-main]
        qt: [PyQt6]
        include:
          - os: macos-latest
            python-version: "3.11"
            mne-version: mne-stable
            qt: PyQt6
          # Old (and PyQt5)
          - os: ubuntu-latest
            python-version: "3.10"
            mne-version: mne-stable
            qt: PyQt5
          # PySide6
          - os: ubuntu-latest
            python-version: "3.11"
            mne-version: mne-main
            qt: PySide6
    steps:
    - uses: actions/checkout@v7.0.1
    - uses: actions/setup-python@v7.0.0
      id: setup-python
      with:
        python-version: ${{ matrix.python-version }}
    # macOS login shells run path_helper, which demotes the setup-python bin dir below system Python
    - name: Workaround macOS login shell PATH
      if: startsWith(matrix.os, 'macos')
      run: echo "export PATH=\"$(dirname '${{ steps.setup-python.outputs.python-path }}'):\$PATH\"" >> ~/.bash_profile
    - uses: pyvista/setup-headless-display-action@main
      with:
        qt: true
    - name: Install Python dependencies using pip
      run: python -m pip install --upgrade pip setuptools_scm setuptools
    - name: Clone MNE stable
      if: "matrix.mne-version == 'mne-stable'"
      run: git clone --single-branch --branch maint/1.11 https://github.com/mne-tools/mne-python.git
    - name: Clone MNE main
      if: "matrix.mne-version == 'mne-main'"
      run: git clone --single-branch --branch main https://github.com/mne-tools/mne-python.git
    - run: git fetch origin --tags
      working-directory: mne-python
    - run: pip install -ve .
      working-directory: mne-python
    - run: pip install -ve . --group test "${{ matrix.qt }}"
    - run: mne sys_info
    - name: Check Qt import
      uses: mne-tools/mne-tools/actions/check-qt-import@main
      with:
        qt-backend: ${{ matrix.qt }}
    - run: python -c "import mne_gui_addons; print(mne_gui_addons.__version__)"
    - run: ./tools/get_testing_version.sh
      working-directory: mne-python
      name: 'Get testing version'
    - uses: actions/cache@v6.1.0
      with:
        key: ${{ env.TESTING_VERSION }}
        path: ~/mne_data
      name: 'Cache testing data'
    - run: ./tools/github_actions_download.sh
      working-directory: mne-python
    - name: Run pytest
      run: pytest mne_gui_addons --cov-report=xml
    - name: Upload coverage stats to codecov
      uses: codecov/codecov-action@v7.0.0
      with:
        token: ebcd818a-7a71-470d-b667-7cd9c3003c7d
      if: success() || failure()
