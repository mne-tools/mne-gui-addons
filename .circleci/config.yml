version: 2.1
jobs:
    build_docs:
      parameters:
        scheduled:
          type: string
          default: "false"
      machine:
        image: ubuntu-2604:2026.05.1
      steps:
        - checkout
        - run:
            name: Check-skip
            command: |
              set -e
              export COMMIT_MESSAGE=$(git log --format=oneline -n 1);
              if [[ -v CIRCLE_PULL_REQUEST ]] && ([[ "$COMMIT_MESSAGE" == *"[skip circle]"* ]] || [[ "$COMMIT_MESSAGE" == *"[circle skip]"* ]]); then
                echo "Skip detected, exiting job ${CIRCLE_JOB} for PR ${CIRCLE_PULL_REQUEST}."
                circleci-agent step halt;
              fi
        - run:
            name: Set BASH_ENV
            command: |
              set -e
              set -o pipefail
              git clone --single-branch --branch main git@github.com:/mne-tools/mne-python.git
              pushd mne-python; git fetch origin --tags; popd
              git clone --single-branch --branch main git@github.com:/mne-tools/mne-tools.git
              ./mne-tools/tools/setup_xvfb.sh
              sudo apt install -qq graphviz optipng python3-venv libxft2 ffmpeg
              python -m venv ~/python_env
              echo "set -e" >> $BASH_ENV
              echo "export OPENBLAS_NUM_THREADS=4" >> $BASH_ENV
              echo "export XDG_RUNTIME_DIR=/tmp/runtime-circleci" >> $BASH_ENV
              echo "export MNE_3D_OPTION_MULTI_SAMPLES=1" >> $BASH_ENV
              echo "export PATH=~/.local/bin/:$PATH" >> $BASH_ENV
              echo "export DISPLAY=:99" >> $BASH_ENV
              echo "source ~/python_env/bin/activate" >> $BASH_ENV
              mkdir -p ~/.local/bin
              ln -s ~/python_env/bin/python ~/.local/bin/python
              echo "BASH_ENV:"
              cat $BASH_ENV
              mkdir -p ~/mne_data
        - run:
            name: Get Python running
            command: |
              pip install --upgrade pip
              pip install --upgrade -e ./mne-python -e . --group doc PySide6
        - run:
            name: Check Qt
            command: |
              ./mne-tools/tools/check_qt_import.sh PySide6
        - run:
            name: Check installation
            command: |
              which python
              QT_DEBUG_PLUGINS=1 mne sys_info -pd
              python -c "import numpy; numpy.show_config()"
              LIBGL_DEBUG=verbose python -c "import pyvistaqt; pyvistaqt.BackgroundPlotter(show=True)"
        - run:
            name: List packages
            command: python -m pip list
        - restore_cache:
            keys:
              - data-cache-sample
        - restore_cache:
            keys:
              - data-cache-misc
        - restore_cache:
            keys:
              - data-cache-somato
        - run:
            name: Get data
            command: |
              python -c "import mne; mne.datasets.somato.data_path(update_path=True, verbose=True); mne.datasets.misc.data_path(update_path=True, verbose=True); sample_path = mne.datasets.sample.data_path(update_path=True, verbose=True); mne.datasets.fetch_fsaverage(subjects_dir=sample_path / 'subjects', verbose=True)"
              ls -al ~/mne_data;
        - run:
            name: make html
            command: |
              make -C doc html
            no_output_timeout: 30m
        - store_test_results:
            path: doc/_build/test-results
        - store_artifacts:
            path: doc/_build/test-results
            destination: test-results
        - store_artifacts:
            path: doc/_build/html/
            destination: dev
        - persist_to_workspace:
            root: doc/_build
            paths:
              - html
        - save_cache:
            key: data-cache-sample
            paths:
              - ~/mne_data/MNE-sample-data
        - save_cache:
            key: data-cache-somato
            paths:
              - ~/mne_data/MNE-somato-data
        - save_cache:
            key: data-cache-misc
            paths:
              - ~/mne_data/MNE-misc-data

    deploy:
      docker:
        - image: cimg/base:current-22.04
      steps:
        - attach_workspace:
            at: /tmp/build
        - restore_cache:
            keys:
              - website-cache
        - add_ssh_keys:
            fingerprints:
              - "SHA256:yUyrLbDEyPEKT1Ohz7tGo+TfdHdcpmPGUdAMlxfJFIA"
        - run:
            name: Deploy docs
            command: |
              set -eo pipefail
              mkdir -p ~/.ssh
              echo -e "Host *\nStrictHostKeyChecking no" > ~/.ssh/config
              chmod og= ~/.ssh/config
              git config --global user.email "circle@mne.tools"
              git config --global user.name "Circle CI"
              ssh-add -D && ssh-add ~/.ssh/id_rsa_1740cc78a4d493785be6e61d12334c0d
              if [ ! -d ~/mne-tools.github.io ]; then
                git clone git@github.com:/mne-tools/mne-tools.github.io.git ~/mne-tools.github.io
              fi
              cd ~/mne-tools.github.io
              git checkout main
              git fetch origin
              git reset --hard origin/main
              git clean -xdf
              echo "Deploying dev docs for ${CIRCLE_BRANCH}."
              rm -Rf mne-gui-addons
              cp -a /tmp/build/html mne-gui-addons
              git add -A
              git commit -m "CircleCI update of mne-gui-addons docs (${CIRCLE_BUILD_NUM})."
              git push origin main
        - save_cache:
            key: website-cache
            paths:
              - ~/mne-tools.githbub.io

workflows:
  default:
    jobs:
      - build_docs:
          filters:
            tags:
              only: /^v.*/
          name: build_docs
      - deploy:
          name: deploy
          requires:
            - build_docs
          filters:
            branches:
              only:
                - main
            tags:
              only: /^v.*/
